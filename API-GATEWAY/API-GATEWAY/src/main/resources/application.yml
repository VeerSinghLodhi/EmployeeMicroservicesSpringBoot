server:
  port: 9090

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: AUTH-SERVICE
              uri: http://localhost:8083
              predicates:
                - Path=/auth/**

            - id: EMPLOYEE-SERVICE
              uri: lb://EMPLOYEE
              predicates:
                - Path=/employees/**
              filters:
                - AuthFilter

            - id: ADDRESS-SERVICE
              uri: lb://ADDRESS
              predicates:
                - Path=/addresses/**
              filters:
                - AuthFilter

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


